<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Spacing Challenge</title>
</head>

<body>

    <section>
        <h1>HTML Spacing Challenge</h1>

        <p>
            This is the first line.<br>
            This is the second line.
        </p>

        <p>
            My favorite color is <span style="color: blue;">blue</span>.
        </p>

        <p>
            This sentence has&nbsp;&nbsp;&nbsp;extra spaces.
        </p>
    </section>

    </footer>

</body>
